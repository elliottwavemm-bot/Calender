name: Deploy to GitHub Pages

# Only `main` deploys. The github-pages environment carries a deployment
# branch rule that rejects other branches, so pushing the working branch
# would just produce failed runs.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          python3 build.py
          mkdir -p _site
          cp -r index.html manifest.webmanifest assets dist _site/
          # A custom domain, if one has been configured.
          [ -f CNAME ] && cp CNAME _site/ || true

      - name: Check the bundle came out whole
        run: |
          test -s _site/dist/inkling.html
          grep -q 'data:font/woff2' _site/dist/inkling.html
          grep -q 'INKLING_EVENTS' _site/dist/inkling.html

      # Pages must already be switched to the Actions source in repository
      # settings. `enablement: true` would create the site automatically, but
      # the workflow's GITHUB_TOKEN is not allowed to ("Resource not
      # accessible by integration"), so this reads the existing config only
      # and fails with a clear message until the setting is turned on.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
