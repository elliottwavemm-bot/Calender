<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkling — Calendar &amp; Sketchbook</title>
<meta name="description" content="A calendar you can draw on: month, week and day views plus a sketchbook, with a pen, highlighter and eraser over every page.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%23c67139'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%237a8a5e' style='mix-blend-mode:multiply'/%3E%3C/svg%3E">

<!-- Home-screen install. iOS ignores SVG favicons and reads apple-touch-icon
     (PNG, no alpha) instead, so the mark ships as a real bitmap. -->
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5ead8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkling">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="stage">
  <div class="device" id="device">
    <div class="screen" data-screen-label="Inkling calendar">

      <header class="topbar">
        <div class="topbar-row">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
            <span class="brand-name">Inkling</span>
          </div>

          <div class="seg" role="radiogroup" aria-label="View">
            <label class="seg-opt"><input type="radio" name="view" value="month" checked>Month</label>
            <label class="seg-opt"><input type="radio" name="view" value="week">Week</label>
            <label class="seg-opt"><input type="radio" name="view" value="day">Day</label>
            <label class="seg-opt"><input type="radio" name="view" value="notes">Notes</label>
          </div>
        </div>

        <div class="topbar-row">
        <div class="navcluster">
          <button class="btn btn-icon btn-ghost" data-nav="-1" aria-label="Previous">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <span class="nav-title" id="navTitle" aria-live="polite"></span>
          <button class="btn btn-icon btn-ghost" data-nav="1" aria-label="Next">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
          <button class="btn btn-ghost btn-today" id="btnToday">Today</button>
        </div>
        </div>
      </header>

      <div class="viewport" id="viewport">
        <div class="zoomable" id="zoomable">

        <section class="view month" id="viewMonth" data-screen-label="Month view">
          <div class="month-head" id="monthHead"></div>
          <div class="month-grid" id="monthGrid"></div>
        </section>

        <section class="view week" id="viewWeek" data-screen-label="Week view" hidden>
          <div class="gutter" id="weekGutter"></div>
          <div class="week-cols" id="weekCols"></div>
        </section>

        <section class="view day" id="viewDay" data-screen-label="Day view" hidden>
          <div class="day-main">
            <div class="gutter" id="dayGutter"></div>
            <div class="day-col">
              <div class="day-head">
                <span class="col-daynum" id="dayNum"></span>
                <span class="day-label" id="dayName"></span>
              </div>
              <div class="track" id="dayTrack"></div>
            </div>
          </div>
          <div class="day-side">
            <div class="day-side-head"><span>Notes &amp; sketches</span></div>
            <div class="paper"></div>
          </div>
        </section>

        <section class="view notes" id="viewNotes" data-screen-label="Sketchbook" hidden>
          <div class="paper">
            <span class="notes-label" id="notesLabel"></span>
          </div>
        </section>
        </div>

        <canvas id="ink" data-tool="pen"></canvas>

        <button class="zoom-pill" id="zoomPill" hidden>100%</button>
        <button class="update-pill" id="updatePill" hidden>Update ready — tap to reload</button>

        <div class="toolbar" role="toolbar" aria-label="Ink tools">
          <button class="btn btn-icon btn-ghost" data-tool="cursor" aria-label="Select mode">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7.07 17 2.51-7.39L21 11.07z"></path></svg>
          </button>
          <button class="btn btn-icon btn-ghost" data-tool="pen" aria-label="Pen">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
          </button>
          <button class="btn btn-icon btn-ghost" data-tool="hl" aria-label="Highlighter">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></svg>
          </button>
          <button class="btn btn-icon btn-ghost" data-tool="er" aria-label="Eraser">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
          </button>

          <span class="toolbar-sep"></span>
          <div id="palette" style="display:flex;gap:5px"></div>

          <span class="toolbar-sep"></span>
          <div id="nibs" style="display:flex;gap:5px"></div>

          <span class="toolbar-sep"></span>
          <button class="btn btn-icon btn-ghost" id="btnUndo" aria-label="Undo">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"></path></svg>
          </button>
          <button class="btn btn-icon btn-ghost" id="btnClear" aria-label="Clear page">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
          </button>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="assets/js/events.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
